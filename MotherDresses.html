<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- সার্চ ইঞ্জিন বন্ধ রাখার ট্যাগ -->
  <meta name="robots" content="noindex, nofollow">
  
  <title>মাদার ড্রেসেস</title>

  <!-- Kalpurush (কালপুরুষ) ফন্ট যুক্ত করা হলো -->
  <link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Kalpurush', 'Segoe UI', Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      max-width: 450px;
      width: 100%;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border-top: 5px solid #d90429;
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }
    .store-name {
      color: #d90429;
      font-size: 28px;
      margin: 0 0 5px 0;
      font-weight: bold;
    }
    .owner-name {
      color: #555;
      font-size: 16px;
      margin-bottom: 20px;
      font-weight: 500;
      border-bottom: 1px dashed #ccc;
      padding-bottom: 10px;
    }
    .ad-image {
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .description {
      color: #333;
      font-size: 18px;
      line-height: 1.6;
      background: #fff0f3;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .info-box {
      text-align: left;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #0077b6;
    }
    .info-item {
      font-size: 16px;
      color: #444;
      margin-bottom: 8px;
    }
    .info-item:last-child {
      margin-bottom: 0;
    }
    .call-btn {
      display: block;
      width: 100%;
      background: #25d366;
      color: white;
      text-decoration: none;
      padding: 12px 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 17px;
      margin-top: 15px;
      text-align: center;
      transition: background 0.3s;
    }
    .call-btn:hover {
      background: #1eb857;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="store-name">মাদার ড্রেসেস</h1>
    <div class="owner-name">প্রোঃ মোঃ মুর্শেদ আলি</div>

    <!-- ছবির লিঙ্ক থাকলে নিচের লাইনটির কমেন্ট তুলে দেবেন -->
    <!-- <img class="ad-image" src="আপনার_ছবির_লিঙ্ক.jpg" alt="মাদার ড্রেসেস"> -->

    <div class="description">
      এখানে সকল প্রকার রেডিমেড এবং শীতবস্ত্র পাওয়া যায়।
    </div>

    <div class="info-box">
      <div class="info-item"><strong>ঠিকানা:</strong> গোফুরপুর বেলচাত্রা, জঙ্গীপুর, মুর্শিদাবাদ।</div>
      <div class="info-item"><strong>যোগাযোগ:</strong> ৮১৪৫৯০৫৬১৪</div>
    </div>

    <a href="tel:8145905614" class="call-btn">📞 কল করুন (8145905614)</a>
  </div>

</body>
</html>
