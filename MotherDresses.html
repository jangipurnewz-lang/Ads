<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>মাদার ড্রেসেস</title>
<link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    font-family:'Kalpurush','Segoe UI',Arial,sans-serif;
    margin:0;padding:20px;min-height:100vh;
    display:flex;justify-content:center;align-items:center;
    background:linear-gradient(180deg,#eaf3fb 0%,#dbe9f5 100%);
  }
  .card{
    max-width:440px;width:100%;
    background:#ffffff;
    border-radius:18px;
    padding:0 0 26px;
    text-align:center;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(23,64,105,0.12);
  }
  .header-band{
    background:#134e73;
    padding:26px 20px 34px;
    position:relative;
  }
  .header-band::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:28px;
    background:#ffffff;
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .store-name{color:#ffffff;font-size:29px;margin:0 0 6px;font-weight:bold}
  .owner-name{color:#bcd7ea;font-size:14px}
  .ad-image{
    width:calc(100% - 48px);
    max-width:260px;
    height:auto;
    display:block;
    margin:4px auto 18px;
    border-radius:12px;
  }
  .description{
    color:#1c3d52;font-size:17px;line-height:1.7;
    margin:6px 24px 20px;
  }
  .info-box{
    text-align:left;background:#f3f8fb;
    margin:0 24px 0;padding:16px 18px;border-radius:12px;
  }
  .info-item{font-size:15px;color:#2a4a5f;margin-bottom:8px}
  .info-item:last-child{margin-bottom:0}
  .info-item strong{color:#134e73}
  .call-btn{
    display:block;width:calc(100% - 48px);margin:20px auto 0;
    background:#1a936f;color:#fff;text-decoration:none;
    padding:13px 0;border-radius:12px;font-weight:bold;font-size:16px;
    transition:background 0.25s;
  }
  .call-btn:hover{background:#157a5c}
</style>
</head>
<body>
  <div class="card">
    <div class="header-band">
      <div class="store-name">মাদার ড্রেসেস</div>
      <div class="owner-name">প্রোঃ মোঃ মুর্শেদ আলি</div>
    </div>

    <img class="ad-image" src="/MotherDresses.png" alt="মাদার ড্রেসেস">

    <div class="description">এখানে সকল প্রকার রেডিমেড এবং শীতবস্ত্র পাওয়া যায়।</div>
    <div class="info-box">
      <div class="info-item"><strong>ঠিকানা:</strong> গোফুরপুর বেলচাত্রা, জঙ্গীপুর, মুর্শিদাবাদ।</div>
      <div class="info-item"><strong>যোগাযোগ:</strong> ৮১৪৫৯০৫৬১৪</div>
    </div>
    <a href="tel:8145905614" class="call-btn">📞 কল করুন (8145905614)</a>
  </div>
</body>
</html>
